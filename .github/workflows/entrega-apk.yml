name: Entrega APK

on:
  push:
    branches: [entrega-apk]

permissions:
  contents: write

jobs:
  limpiar:
    name: Borrar el borrador temporal del APK
    runs-on: ubuntu-latest
    steps:
      - name: Borrar borradores apk-*
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for t in $(gh release list -R "$GITHUB_REPOSITORY" --json tagName,isDraft --jq '.[]|select(.isDraft and (.tagName|startswith("apk-")))|.tagName'); do
            gh release delete "$t" -R "$GITHUB_REPOSITORY" --yes
          done
